AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Diners - App carga de perfiles (mock). Hosting estatico: S3 privado + CloudFront con OAC.
  Fase 1: sin backend; no escribe en Customer Profiles.

Parameters:
  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  NombreApp:
    Type: String
    Default: carga-perfiles
    AllowedPattern: "^[a-z0-9-]{3,30}$"

Resources:
  SitioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${NombreApp}-${Ambiente}-${AWS::AccountId}-sitio"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - { Key: Proyecto, Value: diners-carga-perfiles }
        - { Key: Ambiente, Value: !Ref Ambiente }

  SitioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SitioBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribucion}"
          - Sid: SoloTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SitioBucket.Arn, !Sub "${SitioBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${NombreApp}-${Ambiente}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CabecerasSeguridad:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${NombreApp}-${Ambiente}-seguridad"
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Diners carga de perfiles (${Ambiente})"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: sitio
            DomainName: !GetAtt SitioBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: sitio
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref CabecerasSeguridad
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

Outputs:
  BucketSitio:
    Value: !Ref SitioBucket
  DistribucionId:
    Value: !Ref Distribucion
  UrlApp:
    Value: !Sub "https://${Distribucion.DomainName}"
